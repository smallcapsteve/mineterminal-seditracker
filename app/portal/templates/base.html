<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SEDITracker{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=v32">
  <link rel="icon" type="image/png" href="/static/mnt-logo.svg?v=v10">
  {% block head_extra %}{% endblock %}

<style id="sedi-table-fix-v1">
/* SEDI_TABLE_FIX_V1_BEGIN */
table.sedi-table, table.recent-table, table.insiders-table, table.tickers-table, .container > table, main table {
  table-layout: fixed !important;
  width: 100% !important;
  max-width: 100% !important;
}
/* Defensive overflow on every cell: no single value can blow the layout. */
table th, table td {
  word-wrap: break-word;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* DATE | TICKER | COMPANY | INSIDER | TYPE | SHARES | PRICE | VALUE */
table th:nth-child(1), table td:nth-child(1){width:100px}
table th:nth-child(2), table td:nth-child(2){width:90px}
table th:nth-child(3), table td:nth-child(3){width:auto;max-width:260px}
table th:nth-child(4), table td:nth-child(4){width:200px}
table th:nth-child(5), table td:nth-child(5){width:auto}
table th:nth-child(6), table td:nth-child(6){width:90px;text-align:right}
table th:nth-child(7), table td:nth-child(7){width:75px;text-align:right}
table th:nth-child(8), table td:nth-child(8){width:95px;text-align:right}
/* Container max-width keeps the page centered on wide screens. */
body > .container, body > main, body > .wrap, body > #root, body > #app {
  max-width: 1280px !important;
  margin-left: auto !important;
  margin-right: auto !important;
}
/* SEDI_TABLE_FIX_V1_END */
</style>


<style id="sedi-logo-restyle-v1">
/* SEDI_LOGO_RESTYLE_V1_BEGIN */
.brand-wordmark{
  display:inline-flex !important;
  align-items:baseline !important;
  font-family:'Roboto', system-ui, -apple-system, BlinkMacSystemFont, sans-serif !important;
}
.brand-sedi{
  color:#1a1a1a !important;
  font-weight:900 !important;
  font-size:1.5rem !important;
  letter-spacing:-0.01em !important;
  line-height:1 !important;
}
.brand-tracker{
  color:#D71920 !important;
  font-weight:700 !important;
  font-size:0.85rem !important;
  line-height:1 !important;
  margin-left:4px !important;
  letter-spacing:0.04em !important;
  text-transform:uppercase !important;
}
/* SEDI_LOGO_RESTYLE_V1_END */
</style>


<style id="sedi-logo-restyle-v2">
/* SEDI_LOGO_RESTYLE_V2_BEGIN */
/* Tighten the gap between SEDI and TRACKER */
.brand-tracker{
  margin-left:2px !important;
}
/* SEDI_LOGO_RESTYLE_V2_END */
</style>


<style id="sedi-logo-restyle-v3">
/* SEDI_LOGO_RESTYLE_V3_BEGIN */
.brand-sedi{
  font-size:1.65rem !important;   /* +10% from v1's 1.5rem */
}
/* TRACKER scales proportionally too so it stays balanced. */
.brand-tracker{
  font-size:0.95rem !important;
}
/* SEDI_LOGO_RESTYLE_V3_END */
</style>

</head>
<body>
  <div class="top-ribbon">
    <div class="top-ribbon-inner">
      <span class="top-ribbon-date">{{ now_str or "" }}</span>
      <div class="top-ribbon-links">
        <a href="https://miningnewsterminal.com" target="_blank" rel="noopener">MiningNewsTerminal</a>
        <a href="https://mineterminalpro.com" target="_blank" rel="noopener">MineTerminalPro</a>
        <a href="https://thedeepdive.ca" target="_blank" rel="noopener">TheDeepDive</a>
      </div>
    </div>
  </div>

  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand-link" href="/">
        <img src="/static/mnt-logo.svg?v=v10" alt="" class="brand-icon">
        <span class="brand-wordmark"><span class="brand-sedi">SEDI</span><span class="brand-tracker">Tracker</span></span>
      </a>
      <div class="masthead-right">
        <span class="masthead-tagline">Canadian mining insider trades</span>
      </div>
    </div>
  </header>

  <nav class="primary-nav">
    <div class="primary-nav-inner">
      <div class="primary-nav-links">
        <a href="/" {% if page == 'home' %}class="active"{% endif %}>Recent</a>
        <a href="/tickers" {% if page == 'tickers' %}class="active"{% endif %}>Tickers</a>
        <a href="/insiders" {% if page == 'insiders' %}class="active"{% endif %}>Insiders</a>
      </div>
      <form class="primary-nav-search" method="get" action="/search">
        <input type="search" name="q" placeholder="Insider name or ticker…" value="{{ q or '' }}">
        <button type="submit">Search</button>
      </form>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span><span style="color: var(--brand-red); font-weight: 900;">SEDI</span><span style="color: #1a1a1a; font-weight: 500;">Tracker</span> &copy; 2026 &middot; insider data sourced from SEDI public filings via Stockhouse</span>
  </footer>

<script id="header-date-tz-v1">
/* HEADER_DATE_TZ_V1_BEGIN */
(function(){
  if (window.__mtpHeaderDateTzV1) return;
  window.__mtpHeaderDateTzV1 = true;
  function torontoDate(){
    try {
      var fmt = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Toronto',
        weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
      });
      var parts = fmt.formatToParts(new Date());
      var p = {};
      parts.forEach(function(x){ p[x.type] = x.value; });
      return (p.weekday + ', ' + p.month + ' ' + p.day + ', ' + p.year).toUpperCase();
    } catch(e){ return null; }
  }
  function applyDate(){
    var s = torontoDate();
    if (!s) return;
    var sels = '.top-ribbon-date, .mtp-top-ribbon-date, [class*="ribbon-date"], #mtpRibbonDate';
    document.querySelectorAll(sels).forEach(function(el){
      if (el.textContent.trim() !== s) el.textContent = s;
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', applyDate);
  else applyDate();
  /* Re-check every 30s in case the page is open across the local midnight. */
  setInterval(applyDate, 30000);
})();
/* HEADER_DATE_TZ_V1_END */
</script>

</body>
</html>
